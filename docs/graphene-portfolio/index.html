<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="안민아 그래핀 소자 제작 프로젝트 포트폴리오">
  <title>그래핀 소자 제작 프로젝트 | 안민아</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">SEMICONDUCTOR RESEARCH PORTFOLIO</p>
      <h1>그래핀 소자 제작 프로젝트</h1>
    </div>
    <div class="meta">안민아 · 단국대학교 물리학과</div>
  </header>

  <main>
    <section class="viewer" aria-label="프로젝트 발표자료">
      <button class="nav prev" type="button" aria-label="이전 슬라이드">‹</button>
      <figure>
        <img id="slide" src="slides/slide-1.png" alt="그래핀 프로젝트 발표자료 1페이지">
        <figcaption><span id="current">01</span> / 12</figcaption>
      </figure>
      <button class="nav next" type="button" aria-label="다음 슬라이드">›</button>
    </section>

    <nav class="controls" aria-label="슬라이드 이동">
      <button id="prevText" type="button">이전</button>
      <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
      <button id="nextText" type="button">다음</button>
    </nav>

    <p class="hint">좌우 버튼 또는 키보드 방향키로 넘겨볼 수 있습니다.</p>
  </main>

  <footer>
    <a href="../">반도체 공정 데이터 분석 프로젝트 보기</a>
  </footer>
  <script src="viewer.js"></script>
</body>
</html>
